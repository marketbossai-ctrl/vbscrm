<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Designs — Market Boss AI</title>
<style>
:root { --bg: #0f0f0f; --card: #1a1a1a; --text: #e0e0e0; --muted: #888; --accent: #7c3aed; --accent2: #a78bfa; --green: #22c55e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; }
.container { max-width: 700px; margin: 0 auto; }
h1 { font-size: 1.4rem; margin-bottom: 6px; }
.muted { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
.back-link { display: inline-block; color: var(--muted); text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; }
.back-link:hover { color: var(--text); }
.card { background: var(--card); border-radius: 10px; padding: 18px; margin-bottom: 12px; border-left: 4px solid var(--green); }
.card h3 { font-size: 1rem; margin-bottom: 4px; }
.card .meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
.card a { color: var(--accent2); text-decoration: none; font-size: 0.85rem; }
.card a:hover { text-decoration: underline; }
.empty { background: var(--card); border-radius: 10px; padding: 30px 18px; text-align: center; }
.empty p { color: var(--muted); font-size: 0.9rem; }
.updated { font-size: 0.75rem; color: var(--muted); margin-top: 30px; text-align: center; }.header-contact { text-align: center; margin-top: -18px; margin-bottom: 20px; font-size: 0.75rem; color: var(--muted); }
.header-contact a { color: var(--muted); text-decoration: none; }
.header-contact a:hover { color: var(--accent); }

.logo-header { text-align: center; margin-bottom: 28px; }
.logo-header img { max-width: 180px; height: auto; opacity: 0.9; }
.header-contact { text-align: center; margin-top: -10px; margin-bottom: 20px; font-size: 0.8rem; color: var(--muted); }
.header-contact a { color: var(--muted); text-decoration: none; }
.header-contact a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="logo-header">
  <a href="../"><img src="../img/marketbossai-logo.png" alt="Market Boss AI"></a>
</div>
<div class="header-contact">Call or text Jeff direct: <a href="tel:+17573227171">(757) 322-7171</a></div>
<div class="container">
  <a href="../" class="back-link">← Hub</a>
  <h1>🌐 Website Designs</h1>
  <p class="muted">Client website prototypes, landing pages, and design previews</p>

  <div class="empty">
    <p>No websites yet. When you create a client website design, it will appear here.</p>
    <p class="muted" style="margin-top:8px;">Each design gets its own folder: websites/client-name/</p>
  </div>

  <p class="updated">Powered by <a href="https://marketbossai.com" style="color:var(--accent);text-decoration:none;">Market Boss AI</a></p>
</div>
</body>
</html>
